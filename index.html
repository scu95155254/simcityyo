<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="島丸築城：在海島上當鎮長，和原創小生物島丸一起經營小鎮的 3D 城市建造遊戲。">
<title>島丸築城</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700&family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: the 3D island fills the screen like a tabletop diorama; floating cream cards sit over it:
   stats bar on top, build tray centred at the bottom, mission card top-left, camera controls top-right, inspector bottom-right.
   Single committed light look: paper-cream cards over a mint sea, ink for the active state, amber for the town's name. */
:root{
  --sea:#9fd8d1;
  --paper:#fbf6ec;
  --paper-2:#f2e8d6;
  --card:#fffdf8;
  --ink:#22313f;
  --ink-2:#5e6873;
  --line:#e6d9c2;
  --accent:#d9892b;
  --accent-soft:#f6e2c6;
  --good:#2e7d4b;
  --bad:#c8553a;
  --shadow:0 10px 30px rgba(60,45,20,.16);
  --shadow-sm:0 3px 10px rgba(40,30,10,.14);
  --font-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Fredoka","Chiron GoRound TC",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.glass{background:var(--card);box-shadow:var(--shadow);-webkit-user-select:none;user-select:none}

/* stage + tilt-shift */
.stage{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tilt{position:absolute;left:0;right:0;height:20%;pointer-events:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);z-index:1}
.tilt.top{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.bot{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

/* top stats bar */
.hud{position:absolute;z-index:5;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));border-radius:20px}
.hud-inner{display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px}
.brand{display:flex;flex-direction:column;line-height:1.2;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--accent)}
.day{font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.res{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:14px}
.chip svg{width:20px;height:20px;flex:none}
.chip .v{font-family:var(--font-num);font-weight:600;font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums}
.chip .d{font-size:11px;color:var(--ink-2);line-height:1.2}
.chip .d.up{color:var(--good)} .chip .d.down{color:var(--bad)}
.chip.alert{background:#fbe5dc}
.chip.alert .v{color:var(--bad)}
.speed{display:flex;gap:2px;background:var(--paper);border-radius:999px;padding:3px;flex:none}
.speed button{background:none;border:0;border-radius:999px;padding:5px 10px;font-family:var(--font-num);font-size:13px;color:var(--ink-2);min-width:36px}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{background:var(--accent-soft);border:0;border-radius:999px;padding:8px 14px;font-size:13px;flex:none;color:var(--ink)}
.icon-btn:hover{background:#f1d6b1}

/* floating cards */
.float{position:absolute;border-radius:20px;z-index:2}
.mission{top:96px;left:max(14px,env(safe-area-inset-left,0px));width:min(290px,calc(100% - 90px))}
.mission-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:12px 16px}
.m-step{font-size:11px;letter-spacing:.1em;color:var(--ink-2)}
.m-title{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink);text-wrap:balance}
.m-caret{margin-left:auto;color:var(--ink-2);transition:transform .2s}
.mission.collapsed .m-caret{transform:rotate(-90deg)}
.mission-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.mission.collapsed .mission-body{display:none}
.m-story{margin:0;font-size:13px;line-height:1.6;padding:8px 12px;background:var(--paper);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;color:var(--ink-2)}
.goal{display:flex;flex-direction:column;gap:4px}
.goal-row{display:flex;justify-content:space-between;font-size:13px}
.goal-row .num{color:var(--ink-2)}
.goal.done .goal-row .num{color:var(--good)}
.bar{height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.goal.done .bar i{background:var(--good)}
.reward{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px;line-height:1.6}
.reward b{color:var(--accent);font-weight:500}

.camctl{top:96px;right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;padding:5px;gap:2px}
.camctl button{width:38px;height:36px;border:0;border-radius:12px;background:none;color:var(--ink);display:grid;place-items:center}
.camctl button:hover{background:var(--paper-2)}
.camctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.camctl svg{width:19px;height:19px}

.info{right:max(14px,env(safe-area-inset-right,0px));bottom:150px;width:min(290px,calc(100% - 28px));padding:14px 16px;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 270px);overflow:auto}
.info h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.info p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.info b{color:var(--ink)}
.info .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.info .row span:first-child{color:var(--ink-2)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);font-family:var(--font-body);font-weight:400}
.tag.ok{color:var(--good);border-color:#bfdcc8;background:#eef7f0}
.tag.bad{color:var(--bad);border-color:#efc6b9;background:#fbeee9}
.factors{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2)}
.factors .pos{color:var(--good)} .factors .neg{color:var(--bad)}
.info-close{margin-left:auto;background:none;border:0;color:var(--ink-2);font-size:20px;line-height:1;padding:2px 4px}
.cost{display:flex;gap:10px;font-size:13px}
.cost .short{color:var(--bad)}

#toasts{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 24px));z-index:6}
.toast{background:var(--card);box-shadow:var(--shadow-sm);border-radius:999px;padding:7px 16px;font-size:14px;animation:tin .2s ease-out;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.win{background:var(--good);color:#fff;font-family:var(--font-display);font-weight:700}
@keyframes tin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* bottom build tray */
.tray{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 28px);border-radius:24px}
.tray-inner{display:flex;flex-direction:column;gap:4px;padding:6px 8px 8px}
.tabs{display:flex;gap:4px;padding:0 4px}
.tabs button{background:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--paper-2);color:var(--ink);font-weight:500}
.tools{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:0;background:transparent;border:0;border-radius:18px;padding:4px 4px 6px;position:relative}
.tool:hover{background:var(--paper-2)}
.tool img{width:54px;height:42px;object-fit:contain;pointer-events:none}
.tool .tn{font-size:12px;font-weight:500}
.tool .tc{font-family:var(--font-num);font-size:10px;color:var(--ink-2)}
.tool .tc.short{color:var(--bad)}
.tool .tc.ready{color:var(--accent);font-weight:700}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool[aria-pressed="true"] .tc{color:#c9cfd6}
.tool.locked{opacity:.45}
.tool.locked img{filter:grayscale(1)}
.tool .key{position:absolute;top:3px;left:8px;font-family:var(--font-num);font-size:9px;color:var(--ink-2)}
.tool[aria-pressed="true"] .key{color:#c9cfd6}
.tool .el{position:absolute;top:3px;right:5px;font-size:10px;padding:0 5px;border-radius:99px;color:#10232b}

/* modal + start menu */
.modal{position:fixed;inset:0;background:rgba(30,30,25,.28);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-card{background:var(--card);box-shadow:var(--shadow);border-radius:26px;padding:24px 26px;width:min(500px,100%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-card h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--ink);text-wrap:balance}
.modal-card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.8;color:var(--ink-2)}
.modal-card p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-2)}
.modal-card b{color:var(--accent);font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#2f4152}
.btn.danger{border-color:#efc6b9;color:var(--bad);background:#fbeee9}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.btn{display:inline-block;cursor:pointer}
.info .btns .btn{padding:6px 12px;font-size:13px}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink);font-size:15px;line-height:1.7}

#app.menu-on .hud,#app.menu-on .float,#app.menu-on .tray,#app.menu-on #toasts{display:none}
.menu{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-card{padding:30px 28px 24px;width:min(400px,100%);text-align:center;border-radius:28px;display:flex;flex-direction:column;align-items:center}
@media (min-width:900px){.menu{justify-content:flex-start;padding-left:max(40px,5vw)}}
.logo-badge{display:grid;place-items:center;width:72px;height:72px;border-radius:24px;margin-bottom:10px;background:var(--accent-soft);overflow:hidden}
.logo-badge img{width:92px;max-width:none}
.logo{margin:0;font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:.08em;color:var(--ink)}
.tagline{margin:8px 0 22px;color:var(--ink-2);font-size:14px;letter-spacing:.06em;text-wrap:balance}
.menu-buttons{display:flex;flex-direction:column;gap:10px;width:100%}
.big{padding:13px 16px;font-size:16px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--paper);border:1px solid var(--line);font-family:var(--font-display);font-weight:700;color:var(--ink)}
.big:hover{background:var(--paper-2)}
.big small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-2)}
.big.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.big.primary small{color:#c9cfd6}
.big.primary:hover{background:#2f4152}
.big.ghost{background:transparent}
.note{margin:14px 0 0;font-size:12px;color:var(--ink-2)}

.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starter{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center}
.starter:hover,.starter:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.starter img{width:100%;max-width:130px;aspect-ratio:160/124;object-fit:contain}
.st-text{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.sn{font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;gap:6px;align-items:center}
.sd{font-size:12px;color:var(--ink-2);line-height:1.5}
.catch{display:grid;place-items:center}
.catch canvas{width:min(300px,100%);aspect-ratio:1;cursor:pointer;border-radius:50%}
.art-h{margin:6px 0 0;font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink)}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.art-slot{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:13px;min-width:0}
.art-slot code{font-size:10px;color:var(--ink-2);overflow-wrap:anywhere}
.art-slot.on{border-color:var(--good);background:#eef7f0}
.art-slot.on span::after{content:" ✓";color:var(--good)}

@media (max-width:900px){.info{bottom:150px}}
@media (max-width:640px){
  .tilt{display:none}
  .hud{top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));border-radius:18px}
  .hud-inner{flex-wrap:wrap;gap:6px 8px;padding:6px 8px 6px 12px}
  .brand{flex-direction:row;align-items:baseline;gap:8px;margin-right:auto}
  .brand-name{font-size:16px}
  .res{order:3;flex-basis:100%}
  .chip{padding:2px 6px}
  .chip .v{font-size:15px}
  .mission,.camctl{top:122px}
  .mission{left:max(8px,env(safe-area-inset-left,0px))}
  .camctl{right:max(8px,env(safe-area-inset-right,0px))}
  #toasts{top:122px}
  .tray{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));transform:none;width:auto;max-width:none;bottom:max(8px,env(safe-area-inset-bottom,0px));border-radius:20px}
  .tool{width:62px}
  .tool img{width:46px;height:36px}
  .info{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;bottom:128px;max-height:40%}
  .camctl button{width:34px;height:32px}
  .info.idle{display:none}
  .logo{font-size:34px}
  .starters{grid-template-columns:1fr}.starter{flex-direction:row;text-align:left}.starter img{width:96px}.st-text{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} .bar i{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="hud glass">
    <div class="hud-inner">
      <div class="brand"><span class="brand-name">島丸鎮</span><span class="day num" id="day">第 1 天</span></div>
      <div class="res" id="res" aria-label="資源"></div>
      <div class="speed" role="group" aria-label="遊戲速度">
        <button data-speed="0" aria-pressed="false" title="暫停 (P)">❚❚</button>
        <button data-speed="1" aria-pressed="true">1×</button>
        <button data-speed="2" aria-pressed="false">2×</button>
        <button data-speed="3" aria-pressed="false">3×</button>
      </div>
      <button class="icon-btn" id="menuBtn">選單</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="城鎮地圖"></canvas>
    <div class="tilt top" aria-hidden="true"></div><div class="tilt bot" aria-hidden="true"></div>
    <section class="float glass mission" id="mission" aria-live="polite"></section>
    <div class="float glass camctl" role="group" aria-label="視角">
      <button id="rotL" title="向左旋轉 (Q)" aria-label="向左旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
      <button id="rotR" title="向右旋轉 (E)" aria-label="向右旋轉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
      <button id="camFollow" title="鏡頭跟隨鎮長 (F)" aria-label="鏡頭跟隨鎮長" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"/><path d="M6 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/></svg></button>
      <button id="camHome" title="回到城鎮中心 (R)" aria-label="回到城鎮中心"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <aside class="float glass info" id="info"></aside>
    <div id="toasts" aria-live="polite"></div>
  </main>

  <footer class="tray glass">
    <div class="tray-inner">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-build" aria-selected="true" data-tab="build">建築</button>
        <button role="tab" id="tab-comp" aria-selected="false" data-tab="comp">島丸</button>
      </div>
      <div class="tools" id="tools"></div>
    </div>
  </footer>

  <div class="menu" id="menu" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(() => {
'use strict';
const N = 24, OXI = 27, N2 = 14, OZJ = 5, GW = OXI + N2, HS = .3;
const SAVE_KEY = 'lingshou-town-v1';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

/* =========================================================
   GAME RULES
   ========================================================= */
const B = {
  road:   {name:'道路', cost:{coin:5}, needsRoad:false, desc:'把建築串起來。除了公園，建築都要緊鄰道路才會運作。'},
  house:  {name:'住宅', cost:{coin:40, wood:10}, cap:6, power:1, upkeep:0, desc:'可住 6 位居民並繳稅。需要電力；附近有公園、商店會更幸福。'},

  const v = []; for (let k = 0; k < (g + 1) * (g + 1); k++) v.push(r());

    const fx = x / size * g, fy = y / size * g, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const at = (a, b) => v[Math.min(b, g) * (g + 1) + Math.min(a, g)];
    const a = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * tx;
    const b = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * tx;
    return a + (b - a) * ty;

/* ---- sync state -> scene ---- */
function syncWorld(){

    const d = b ? describe(b.t, i, j, b.id, b.lv || 1) : null;

    if (cur){ world.remove(cur.obj); if (cur.dyn) dynList.splice(dynList.indexOf(cur.dyn), 1); tileObjs.delete(k); }
    if (!d) continue;

    const [x, z] = tileXZ(i, j); obj.position.set(x, tileY(k), z); obj.rotation.y = d.rot;
    let dyn = null;

    tileObjs.set(k, {key, obj, dyn});

  const want = new Map();

  for (const [k, s] of sprites){ if (want.get(k) !== s.userData.kind){ scene.remove(s); sprites.delete(k); } }

    const i = k % N, j = (k / N) | 0, [x, z] = tileXZ(i, j); s.position.set(x, 1.15, z); s.userData = {kind, base:1.15};

  const dx = tx - o.position.x, dz = tz - o.position.z, d = Math.hypot(dx, dz);

  const m = Math.min(d, sp * dt); o.position.x += dx / d * m; o.position.z += dz / d * m; turnTo(o, Math.atan2(dx, dz), dt);

}

    const [cx, cz] = gXZ(gi, gj);
    for (const s of st){ const u = (x - cx) * s.dx + (z - cz) * s.dz, v = (x - cx) * s.dz - (z - cz) * s.dx; if (u > .04 && Math.abs(v) < .36) y = Math.max(y, s.y0 + clamp((u - .04) / .46, 0, 1) * (s.y1 - s.y0)); }

/* =========================================================
   LOOP & BOOT
   ========================================================= */
let lastT = 0, acc = 0;
const INTERVAL = [Infinity, 1.2, .6, .3];
function frame(ts){
  const t = ts / 1000, dt = Math.min(.1, t - (lastT || t)); lastT = t;
  if (speed > 0){ acc += dt; let n = 0; while (acc >= INTERVAL[speed] && n < 4){ acc -= INTERVAL[speed]; tick(); n++; } }
  else acc = 0;
  if (menuOpen && !reduceMotion){ camT.az += dt * .06; camT.dist = W < 640 ? 40 : 34; camT.tx = 0; camT.tz = 0; }
  applyCam(dt);
  updateWater(t);
  for (let q = anims.length - 1; q >= 0; q--){
    const a = anims[q], p = (now() - a.t0) / a.d, to = a.to || 1;
    if (p >= 1){ a.obj.scale.setScalar(to); anims.splice(q, 1); continue; }
    const c1 = 1.70158, c3 = c1 + 1, e = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    a.obj.scale.setScalar(Math.max(.01, e * to));
  }
  for (let q = debris.length - 1; q >= 0; q--){
    const d = debris[q], a = now() - d.t0;
    if (a > d.life){ scene.remove(d.p); d.p.geometry.dispose(); debris.splice(q, 1); continue; }
    d.p.position.x += d.vx * dt; d.p.position.z += d.vz * dt; d.p.position.y += d.vy * dt; d.vy -= dt * (d.shrink ? .8 : 2.2);
    if (d.shrink) d.p.scale.setScalar(1 - a / d.life); else { d.p.rotation.x += d.spin * dt; d.p.rotation.z += d.spin * dt * .7; d.vx *= .98; d.vz *= .98; }
  }
  if (!reduceMotion) for (const d of dynList) d.g.userData.update(t, E.info.get(d.k)?.active !== false);
  for (const [, s] of sprites) s.position.y = s.userData.base + (reduceMotion ? 0 : Math.sin(t * 3) * .05);
  if (CYBER_ON) for (const [, o] of groupObjs){ const sp = o.obj.userData.sprite; sp.material.opacity = .82 + Math.sin(t * 3) * .1 + (Math.sin(t * 29 + o.obj.position.x) > .97 ? -.45 : 0); }
  for (const c of clouds){ if (!reduceMotion) c.position.x += c.userData.v * dt; if (c.position.x > 40) c.position.x = -32; c.visible = c.position.distanceTo(camera.position) > 13; }
  updateMayor(dt, t);
  updateScenery(dt, t);
  updateAgents(dt, t);
  updatePeople(dt, t);
  updateDrones(dt, t);
  updateOverlays(t);
  renderFrame();
  requestAnimationFrame(frame);
}

  }
  const snap = data && data.S;
  S = (snap && snap.v === 1) ? migrate(snap) : load();
  const fresh = !S;
  if (!S) newGame();
  BADGE = [new T3.SpriteMaterial({map:badgeTex('!', '#ff5a48'), depthTest:false}), new T3.SpriteMaterial({map:badgeTex('…', '#ffa94d'), depthTest:false})];
